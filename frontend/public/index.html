<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    [{[ if .ReCaptcha -]}]
    <script src="[{[ .ReCaptchaHost ]}]/recaptcha/api.js?render=explicit"></script>
    [{[ end ]}]

    <title>
      [{[ if .Name -]}][{[ .Name ]}][{[ else ]}]UnyCloud[{[ end ]}]
    </title>

    <meta
      name="robots"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate"
    />
    <meta
      name="googlebot"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate"
    />
    <meta
      name="bingbot"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate"
    />

    <link rel="icon" href="[{[ .StaticURL ]}]/img/icons/favicon.ico" />
    <link rel="shortcut icon" href="[{[ .StaticURL ]}]/img/icons/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="[{[ .StaticURL ]}]/img/icons/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="UnyCloud" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script src="[{[ .StaticURL ]}]/pwa-install.js"></script>

    <!-- Add to home screen for Android and modern mobile browsers -->
    <link
      rel="manifest"
      id="manifestPlaceholder"
      href="[{[ .StaticURL ]}]/manifest.json"
      crossorigin="use-credentials"
    />
    <meta
      name="theme-color"
      content="[{[ if .Color -]}][{[ .Color ]}][{[ else ]}]#5a52c8[{[ end ]}]"
    />

    <link rel="stylesheet" href="[{[ .StaticURL ]}]/loading.css" />
    <script src="[{[ .StaticURL ]}]/runtime.js"></script>
    [{[ if .CSS -]}]
    <link rel="stylesheet" href="[{[ .StaticURL ]}]/custom.css" />
    [{[ end ]}]
  </head>
  <body>
    <div id="app"></div>

    <div id="loading">
      <div class="spinner">
        <div class="bounce1"></div>
        <div class="bounce2"></div>
        <div class="bounce3"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
