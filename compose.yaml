services:
  unycloud:
    container_name: unycloud
    image: unycloud:local
    build:
      context: .
    networks:
      - unycloud
    ports:
      - 8000:80
    volumes:
      - unycloud-data:/srv
      - unycloud-config:/config
      - unycloud-database:/database
    environment:
      - FB_REDIS_CACHE_URL=redis://default:unycloud@redis:6379 # Use rediss:// for ssl

  redis:
    container_name: redis
    image: redis:latest
    networks:
      - unycloud
    command:
      - sh
      - -c
      - |
        cat > /tmp/users.acl <<EOF
        user default on >unycloud ~* +@all
        EOF
        redis-server --aclfile /tmp/users.acl

networks:
  unycloud:

volumes:
  unycloud-data:
  unycloud-config:
  unycloud-database:
